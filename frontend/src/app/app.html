<main class="pagina">
  <p class="etiqueta">UNAD IA 360 · Integración de servicios</p>

  <h1>Mesa de Ayuda Inteligente</h1>
  <p class="descripcion">Comprobación de la comunicación entre Angular y FastAPI.</p>

  @if (estado() === 'comprobando') {
    <p class="estado" role="status">Comprobando conexión con la API...</p>
  } @else if (estado() === 'conectada') {
    <p class="estado correcto" role="status">API conectada</p>
  } @else {
    <p class="estado error" role="alert">Sin conexión con la API</p>
  }
</main>
